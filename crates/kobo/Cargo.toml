[package]
name = "kobo"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
futures-util = "0.3.34"
html-escape = "0.3.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "sync", "io-util", "rt"] }
tracing = "0.1.44"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
