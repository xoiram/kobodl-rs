[package]
name = "kobodl-web"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
kobo = { version = "0.1.0", path = "../kobo" }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
wiremock = "0.6.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
